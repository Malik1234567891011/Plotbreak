<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Play current</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width:1680px;height:960px;box-sizing:border-box;padding:28px 30px;background:#E9EBEF;font-family:Inter,system-ui,sans-serif;color:#1B1F2A;display:flex;flex-direction:column;gap:14px">
  <div style="display:flex;align-items:baseline;gap:12px">
    <span style="font-size:13px;font-weight:700;letter-spacing:0.12em;color:#B4233C">CURRENT</span>
    <span style="font-size:14px;color:#4A5160">Itachi from Play: archetype page, cinematic opener (good, keep it), then the feed</span>
  </div>
  <div style="display:flex;gap:20px">
    <sc-for list="{{shots}}" as="s" hint-placeholder-count="4">
      <figure style="margin:0;display:flex;flex-direction:column;gap:8px;width:390px">
        <img src="{{s.src}}" alt="{{s.cap}}" style="width:390px;height:848px;object-fit:cover;border-radius:28px;display:block;box-shadow:0 6px 24px rgba(0,0,0,0.18)">
        <figcaption style="font-size:13px;color:#4A5160">{{s.cap}}</figcaption>
      </figure>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1680,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    return { shots: [
      { src: '/_blob/ade82fd6f4ebd727aef41bd1648e92f4', cap: 'A full page of text before the story starts' },
      { src: '/_blob/cf696230b0716fe3955c2c6fbb1f860e', cap: 'Opener panels: the best screen in the app' },
      { src: '/_blob/0cf6b9862f209068745cf49941d33247', cap: 'Then the feed: serif text only, no faces' },
      { src: '/_blob/967e78551bc0adf895e5093fbca0575d', cap: 'Suggestions: send-only, no edit, no type' }
    ] };
  }
}
</script>
</body>
</html>

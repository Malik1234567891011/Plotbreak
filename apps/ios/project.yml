# Generated into Plotbreak.xcodeproj with `xcodegen generate` (brew install xcodegen).
# The .xcodeproj is committed too, so Xcode opens without the tool; regenerate
# after adding files outside Xcode.
name: Plotbreak
options:
  bundleIdPrefix: com.plotbreak
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Plotbreak/Config/Debug.xcconfig
  Release: Plotbreak/Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: Q7ZLXMG4SB
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 4
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_USER_SCRIPT_SANDBOXING: false
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.0.0
  # Ad attribution (AppsFlyer): one SDK that reports installs, sign-ups and
  # purchases back to Meta, TikTok and Google Ads. See docs/ads/README.md.
  AppsFlyerLib:
    url: https://github.com/AppsFlyerSDK/AppsFlyerFramework
    from: 7.0.2
  # Product analytics (PostHog): the §37 event contract. Distinct from
  # AppsFlyer above, which answers "which ad brought this install"; this
  # answers "what did they then do". docs/analytics.md is the map.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: 3.74.0
targets:
  Plotbreak:
    type: application
    platform: iOS
    sources:
      - path: Plotbreak
        excludes:
          - "Config/*.xcconfig"
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: AppsFlyerLib
        product: AppsFlyerLib
      - package: PostHog
        product: PostHog
    entitlements:
      path: Plotbreak/Plotbreak.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Plotbreak/Info.plist
      properties:
        CFBundleDisplayName: Plotbreak
        CFBundleName: Plotbreak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [plotbreak]
          # Google Sign-In returns to the app on the reversed client id.
          - CFBundleURLSchemes: [$(PLOTBREAK_GOOGLE_URL_SCHEME)]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Filled from the xcconfig so Debug talks to localhost and Release to Railway.
        PLOTBREAK_API_URL: $(PLOTBREAK_API_URL)
        PLOTBREAK_SUPABASE_URL: $(PLOTBREAK_SUPABASE_URL)
        PLOTBREAK_SUPABASE_ANON_KEY: $(PLOTBREAK_SUPABASE_ANON_KEY)
        PLOTBREAK_LEGAL_BASE_URL: $(PLOTBREAK_LEGAL_BASE_URL)
        PLOTBREAK_GOOGLE_CLIENT_ID: $(PLOTBREAK_GOOGLE_CLIENT_ID)
        PLOTBREAK_APPSFLYER_DEV_KEY: $(PLOTBREAK_APPSFLYER_DEV_KEY)
        PLOTBREAK_APPLE_APP_ID: $(PLOTBREAK_APPLE_APP_ID)
        PLOTBREAK_POSTHOG_KEY: $(PLOTBREAK_POSTHOG_KEY)
        PLOTBREAK_POSTHOG_HOST: $(PLOTBREAK_POSTHOG_HOST)
        # The App Tracking Transparency prompt. Asked once, after the first
        # story beat (Attribution.swift), never at launch.
        NSUserTrackingUsageDescription: Lets us see which ads bring in players who enjoy Plotbreak, so we can make more stories like the ones you play.
        # The ad networks Apple's SKAdNetwork may credit for an install. Each
        # network publishes its own ids; a network missing from this list can
        # never be credited, however much it is spending.
        SKAdNetworkItems:
          # Meta (Facebook + Instagram)
          - SKAdNetworkIdentifier: v9wttpbfk9.skadnetwork
          - SKAdNetworkIdentifier: n38lu8286q.skadnetwork
          # TikTok
          - SKAdNetworkIdentifier: 238da6jt44.skadnetwork
          - SKAdNetworkIdentifier: 22mmun2rn5.skadnetwork
          # Google Ads
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plotbreak.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
    preBuildScripts:
      - name: Export i18n catalog
        script: |
          cd "$SRCROOT/../.."
          if command -v node >/dev/null 2>&1 && [ -d node_modules ]; then
            node apps/ios/scripts/export-catalog.mjs || echo "warning: catalog export failed, using committed JSON"
          fi
        basedOnDependencyAnalysis: false
      # Regenerates PlotbreakEvent from packages/analytics, so a renamed event
      # breaks the build here rather than going quiet on a dashboard.
      - name: Export analytics events
        script: |
          cd "$SRCROOT/../.."
          if command -v node >/dev/null 2>&1 && [ -d node_modules ]; then
            node apps/ios/scripts/export-events.mjs || echo "warning: event export failed, using committed Swift"
          fi
        basedOnDependencyAnalysis: false
  PlotbreakTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlotbreakTests
      # The StoreKit products, so SKTestSession can find them by name.
      - path: Plotbreak.storekit
        buildPhase: resources
    dependencies:
      - target: Plotbreak
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plotbreak.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Plotbreak.app/Plotbreak
        BUNDLE_LOADER: $(TEST_HOST)
        # The bundle is signed along with the app, and signing needs one.
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Plotbreak:
    build:
      targets:
        Plotbreak: all
        PlotbreakTests: [test]
    test:
      targets:
        - PlotbreakTests
    run:
      config: Debug
      # Local StoreKit products, so the purchase flow can be run without App
      # Store Connect. Transactions made against it report the `.xcode`
      # environment, which is the one case the app labels SANDBOX so our own
      # dev verifier will check it — see Purchases.syncRequest.
      storeKitConfiguration: Plotbreak.storekit
    archive:
      config: Release
